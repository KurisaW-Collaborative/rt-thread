# Automation utest run script for the QEMU platform
# Generate the corresponding config configuration for CI based on the configuration file under .github/utest.

name: utest_auto_run

on:
  push:
    branches:
      - master
    paths-ignore:
      - documentation/**
      - '**/README.md'
      - '**/README_zh.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - documentation/**
      - '**/README.md'
      - '**/README_zh.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    name: ${{ matrix.platform.UTEST }} :${{ matrix.config_file }}
    # if: github.repository_owner == 'RT-Thread'
    strategy:
      fail-fast: false
      matrix:
        # 定义平台配置模板
        platform_template:
          - name: "A9"
            bsp: "bsp/qemu-vexpress-a9"
            arch: "arm"
            machine: "vexpress-a9"
            sd_file: "sd.bin"
            kernels: ["standard", "rtsmart"]
            smp: ["smp"]
            special_tests: ["kernel/object.cfg", "dfs/dfs.cfg", "cpp11/cpp11.cfg"]
          
          - name: "RISCV"
            bsp: "bsp/qemu-virt64-riscv"
            arch: "riscv64"
            machine: "virt"
            sd_file: "None"
            kernels: ["standard", "rtsmart"]
            smp: [""]
            # smp: ["", "smp"]  # 注释掉的暂时不启用
            special_tests: []
          
          - name: "XUANTIE"
            bsp: "bsp/xuantie/virt64/c906"
            arch: "riscv64"
            machine: "virt"
            sd_file: "sd.bin"
            kernels: ["rtsmart"]
            smp: [""]
            special_tests: []
          
          - name: "AARCH64"
            bsp: "bsp/qemu-virt64-aarch64"
            arch: "aarch64"
            machine: "virt"
            sd_file: "sd.bin"
            kernels: ["standard", "rtsmart"]
            smp: [""]
            # smp: ["", "smp"]  # 注释掉的暂时不启用
            special_tests: []
        
        # 动态生成平台矩阵
        include:
          # 为每个平台模板生成标准配置
          - ${{ each platform in matrix.platform_template }}:
            - ${{ each kernel in platform.kernels }}:
              - ${{ each smp in platform.smp }}:
                platform:
                  UTEST: "${{ platform.name }}${{ kernel != 'standard' && format('-{0}', kernel) || '' }}${{ smp != '' && format('-{0}', smp) || '' }}"
                  RTT_BSP: "${{ platform.bsp }}"
                  QEMU_ARCH: "${{ platform.arch }}"
                  QEMU_MACHINE: "${{ platform.machine }}"
                  SD_FILE: "${{ platform.sd_file }}"
                  KERNEL: "${{ kernel }}"
                  SMP_RUN: "${{ smp }}"
                config_file: "default.cfg"
          
          # 为支持特殊测试的平台生成特殊测试配置
          - ${{ each platform in matrix.platform_template }}:
            - ${{ if platform.special_tests }}:
              - ${{ each test_file in platform.special_tests }}:
                platform:
                  UTEST: "${{ platform.name }}"
                  RTT_BSP: "${{ platform.bsp }}"
                  QEMU_ARCH: "${{ platform.arch }}"
                  QEMU_MACHINE: "${{ platform.machine }}"
                  SD_FILE: "${{ platform.sd_file }}"
                  KERNEL: "standard"
                  SMP_RUN: ""
                config_file: "${{ test_file }}"

    env:
      TEST_QEMU_ARCH: ${{ matrix.platform.QEMU_ARCH }}
      TEST_QEMU_MACHINE: ${{ matrix.platform.QEMU_MACHINE }}
      TEST_BSP_ROOT: ${{ matrix.platform.RTT_BSP }}
      TEST_CONFIG_FILE: ${{ matrix.config_file }}
      TEST_SD_FILE: ${{ matrix.platform.SD_FILE }}
    
    steps:
      - uses: actions/checkout@main

      - name: Install Tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get -yqq install scons qemu-system git
          pip3 install kconfiglib

      - name: Install ToolChains
        shell: bash
        run: |
          # 工具链配置映射
          TOOLCHAINS=(
            # 格式: 架构:内核:工具链类型:下载URL:安装路径:前缀:环境变量标识
            "arm:standard:gcc:https://github.com/RT-Thread/toolchains-ci/releases/download/v1.3/gcc-arm-none-eabi-10-2020-q4-major-x86_64-linux.tar.bz2:/opt/gcc-arm-none-eabi-10-2020-q4-major:arm-none-eabi-:arm"
            "arm:rtsmart:musl:https://github.com/RT-Thread/toolchains-ci/releases/download/v1.7/arm-linux-musleabi_for_x86_64-pc-linux-gnu_stable.tar.bz2:/opt/arm-linux-musleabi_for_x86_64-pc-linux-gnu:arm-linux-musleabi-:arm-musl"
            "riscv64:standard:gcc:https://github.com/RT-Thread/toolchains-ci/releases/download/v1.4/riscv64-unknown-elf-toolchain-10.2.0-2020.12.8-x86_64-linux-ubuntu14.tar.gz:/opt/riscv64-unknown-elf-toolchain-10.2.0-2020.12.8-x86_64-linux-ubuntu14::riscv"
            "riscv64:rtsmart:musl:https://github.com/RT-Thread/toolchains-ci/releases/download/v1.7/riscv64-linux-musleabi_for_x86_64-pc-linux-gnu_latest.tar.bz2:/opt/riscv64-linux-musleabi_for_x86_64-pc-linux-gnu:riscv64-unknown-linux-musl-:riscv-musl"
            "aarch64:standard:gcc:https://github.com/RT-Thread/toolchains-ci/releases/download/v1.6/gcc-arm-10.2-2020.11-x86_64-aarch64-none-elf.tar.xz:/opt/gcc-arm-10.2-2020.11-x86_64-aarch64-none-elf:aarch64-none-elf-:aarch64"
            "aarch64:rtsmart:musl:https://github.com/RT-Thread/toolchains-ci/releases/download/v1.7/aarch64-linux-musleabi_for_x86_64-pc-linux-gnu_stable.tar.bz2:/opt/aarch64-linux-musleabi_for_x86_64-pc-linux-gnu:aarch64-linux-musleabi-:aarch64-musl"
          )
          
          # 特殊工具链处理
          XUANTIE_TOOLCHAIN="riscv64:rtsmart:xuantie:https://github.com/RT-Thread/toolchains-ci/releases/download/v1.9/Xuantie-900-gcc-linux-6.6.0-musl64-x86_64-V3.0.2.tar.gz:/opt/Xuantie-900-gcc-linux-6.6.0-musl64-x86_64-V3.0.2:riscv64-unknown-linux-musl-:riscv-musl"
          
          TOOLCHAIN_INSTALLED=""
          
          # 检查是否是玄铁平台
          if [[ "${{ matrix.platform.UTEST }}" == "XUANTIE-rtsmart" ]]; then
            IFS=':' read -r x_arch x_kernel x_type x_url x_path x_prefix x_env <<< "$XUANTIE_TOOLCHAIN"
            echo "Starting install RISC-V XUANTIE Musl ToolChains"
            wget -q "$x_url"
            sudo tar zxvf "$(basename $x_url)" -C /opt
            "$x_path/bin/${x_prefix}gcc" --version
            echo "RTT_EXEC_PATH=$x_path/bin" >> $GITHUB_ENV
            echo "RTT_CC_PREFIX=$x_prefix" >> $GITHUB_ENV
            echo "TOOLCHAIN_INSTALLED=$x_env" >> $GITHUB_ENV
          else
            # 普通工具链安装
            for toolchain in "${TOOLCHAINS[@]}"; do
              IFS=':' read -r arch kernel type url path prefix env <<< "$toolchain"
              
              if [[ "${{ matrix.platform.QEMU_ARCH }}" == "$arch" && "${{ matrix.platform.KERNEL }}" == "$kernel" ]]; then
                echo "Starting install $arch $kernel ToolChains"
                wget -q "$url"
                
                # 根据文件扩展名选择解压方式
                if [[ "$url" == *.tar.bz2 ]]; then
                  sudo tar xjf "$(basename $url)" -C /opt
                elif [[ "$url" == *.tar.gz ]]; then
                  sudo tar zxvf "$(basename $url)" -C /opt
                elif [[ "$url" == *.tar.xz ]]; then
                  sudo tar -xvJf "$(basename $url)" -C /opt
                fi
                
                # 验证安装
                if [[ -n "$prefix" ]]; then
                  "$path/bin/${prefix}gcc" --version
                else
                  # 对于没有前缀的工具链（如riscv标准版）
                  find "$path/bin" -name "*gcc" | head -1 | xargs --version
                fi
                
                echo "RTT_EXEC_PATH=$path/bin" >> $GITHUB_ENV
                if [[ -n "$prefix" ]]; then
                  echo "RTT_CC_PREFIX=$prefix" >> $GITHUB_ENV
                fi
                echo "TOOLCHAIN_INSTALLED=$env" >> $GITHUB_ENV
                break
              fi
            done
          fi
          
          # C++11 特殊处理
          if [[ "${{ matrix.platform.QEMU_ARCH }}" == "arm" && "${{ matrix.config_file }}" == "cpp11/cpp11.cfg" && "${{ matrix.platform.KERNEL }}" == "standard" ]]; then
            sudo rm -f /opt/gcc-arm-none-eabi-10-2020-q4-major/arm-none-eabi/include/c++/10.2.1/{thread,mutex,condition_variable,future}
            sudo rm -f /opt/gcc-arm-none-eabi-10-2020-q4-major/arm-none-eabi/include/pthread.h
            sudo cat /dev/null > /opt/gcc-arm-none-eabi-10-2020-q4-major/arm-none-eabi/include/sys/_pthreadtypes.h
            sed -i 's/-fno-exceptions/ /g' $TEST_BSP_ROOT/rtconfig.py
          fi
          
          if [[ -z "$TOOLCHAIN_INSTALLED" ]]; then
            echo "No valid toolchain installed, stopping the workflow."
          fi

      - name: Build BSP
        if: ${{ env.TOOLCHAIN_INSTALLED != '' && success() }}
        run: |
          # Whether plan to run SMP?
          if [[ "${{ matrix.platform.SMP_RUN }}"  == "smp" ]]; then
            cat .github/utest/smp/smp.cfg >> $TEST_BSP_ROOT/.config
          fi

          # Is the kernel rtsmart?
          if [[ "${{ matrix.platform.KERNEL }}"  == "rtsmart" ]]; then
            cat .github/utest/rtsmart/rtsmart.cfg >> $TEST_BSP_ROOT/.config
          fi

          echo CONFIG_RT_USING_UTESTCASES=y >> $TEST_BSP_ROOT/.config
          cat .github/utest/$TEST_CONFIG_FILE >> $TEST_BSP_ROOT/.config
          scons --pyconfig-silent -C $TEST_BSP_ROOT
          scons -j$(nproc) --strict -C $TEST_BSP_ROOT

      - name: QEMU Run Test
        if: ${{ env.TOOLCHAIN_INSTALLED != '' && success() }}
        run: |
          if [ "$TEST_SD_FILE" != "None" ]; then
            dd if=/dev/zero of=$TEST_BSP_ROOT/sd.bin bs=1024 count=65536
            mkfs.fat $TEST_BSP_ROOT/sd.bin
          fi

          if [[ "${{ matrix.platform.QEMU_ARCH }}"  == "aarch64" ]]; then 
            qemu-system-$TEST_QEMU_ARCH -M virt,gic-version=2 -cpu cortex-a53 -smp 4 -kernel $TEST_BSP_ROOT/rtthread.bin  -nographic \
            -drive if=none,file=$TEST_BSP_ROOT/sd.bin,format=raw,id=blk0 -device virtio-blk-device,drive=blk0,bus=virtio-mmio-bus.0 \
            -netdev user,id=net0 -device virtio-net-device,netdev=net0,bus=virtio-mmio-bus.1 \
            > qemu_output_$TEST_QEMU_ARCH.log  2>&1 &
          elif [[ "${{ matrix.platform.UTEST }}"  == "XUANTIE-rtsmart" ]]; then
            sudo apt-get install -y dos2unix libcapstone-dev libbrlapi-dev
            wget -q https://occ-oss-prod.oss-cn-hangzhou.aliyuncs.com/resource//1736318325160/Xuantie-qemu-x86_64-Ubuntu-20.04-V5.0.5-B20250108-0335.tar.gz
            tar zxvf  Xuantie-qemu-x86_64-Ubuntu-20.04-V5.0.5-B20250108-0335.tar.gz
            dos2unix ./install/qemu_post_install_small.sh
            sudo chmod +x ./install/qemu_post_install_small.sh
            sudo ./install/qemu_post_install_small.sh

            QEMU_BIN="./install/bin/qemu-system-$TEST_QEMU_ARCH"
            [ ! -f "$QEMU_BIN" ] && echo "ERROR: $QEMU_BIN not found." && exit 1

            tmp_output=$(mktemp)
            ldd "$QEMU_BIN" > "$tmp_output" 2>&1
            missing_libs=$(grep "not found" "$tmp_output" | awk '{print $1}')

            for lib in $missing_libs; do
              base_lib=$(echo "$lib" | sed -E 's/\.so.*/\.so/')
              echo "🔍 修复基础库：$base_lib ..."
              sudo ln -s /usr/lib/x86_64-linux-gnu/$base_lib  /usr/lib/x86_64-linux-gnu/$lib
            done
            echo "✅ 所有缺失库已处理。"

            $QEMU_BIN -cpu c906fd -M $TEST_QEMU_MACHINE -kernel $TEST_BSP_ROOT/rtthread.bin -nographic \
            -drive if=none,file=$TEST_BSP_ROOT/sd.bin,format=raw,id=blk0 -device virtio-blk-device,drive=blk0,bus=virtio-mmio-bus.0 \
            > qemu_output_$TEST_QEMU_ARCH.log  2>&1 &
          elif [[ "${{ matrix.platform.QEMU_ARCH }}"  == "arm" ]]; then 
            qemu-system-$TEST_QEMU_ARCH \
                -nographic \
                -M $TEST_QEMU_MACHINE \
                -kernel $TEST_BSP_ROOT/rtthread.bin  \
                -sd $TEST_BSP_ROOT/sd.bin  \
                > qemu_output_$TEST_QEMU_ARCH.log  2>&1 &
          else 
            qemu-system-$TEST_QEMU_ARCH \
                -nographic \
                -M $TEST_QEMU_MACHINE \
                -kernel $TEST_BSP_ROOT/rtthread.bin  \
                > qemu_output_$TEST_QEMU_ARCH.log  2>&1 &
          fi 

          QEMU_PID=$!
          disown $QEMU_PID
      
      - name: Monitor qemu log
        if: ${{ env.TOOLCHAIN_INSTALLED != '' && success() }}
        run: |
          FAILURE_DETECTED=false
          ERROR_LOGS=""
          
          echo "=========================================================================================="
          echo " ||                                                                                    || "
          echo " ||                          Start automatic running of Utest                          || "
          echo " VV                                                                                    VV "
          echo "=========================================================================================="
          tail -n 0 -f qemu_output_$TEST_QEMU_ARCH.log | while read line; do
            echo $line
            if [[ "$line" == *"[  FAILED  ] [ result   ]"* ]]; then
              ERROR_LOGS="$ERROR_LOGS$line"$'\n'
              FAILURE_DETECTED=true
            fi
            
            if [[ "$line" == *"[==========] [ utest    ] finished"* ]]; then
              if $FAILURE_DETECTED; then
                echo "=========================================================================================="
                echo " ||                                                                                    || "
                echo " ||         Error: Failures detected in logs. Below are the failure details...         || "
                echo " VV                                                                                    VV "
                echo "=========================================================================================="
                echo "$ERROR_LOGS"
                exit 1
              fi
              echo "=========================================================================================="
              echo "                  Successed: Utest run completed. Exiting log monitoring                  "
              echo "=========================================================================================="
              break
            fi
          done
